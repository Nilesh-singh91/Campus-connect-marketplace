name: CampusConnect Marketplace CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: campusconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Verify TypeScript compilation
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/campusconnect_test?schema=public"
          JWT_SECRET: "test-super-secret-key-32-chars-long-example"
        run: npm run build
